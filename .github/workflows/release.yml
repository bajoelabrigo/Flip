name: Release

# Flip Studio: pushing a vX.Y.Z tag builds the Windows installer and portable zip and publishes
# them as a GitHub release of this repository, which is where the in-app updater downloads from.
# Other platforms join `platforms` below as they are brought up (see ROADMAP.md, phase 4).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release readiness
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches CMakeLists.txt version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(grep -oP '^project\(Drift VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          if [ "${tag_version}" != "${cmake_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match CMakeLists.txt's project version (${cmake_version})"
            exit 1
          fi
          echo "version=${tag_version}" >> "$GITHUB_OUTPUT"

      # Each release ships the notes written for it; a missing file stops the release before
      # anything is built.
      - name: Check release notes exist for this version
        shell: bash
        run: |
          notes="release-notes/${{ steps.version.outputs.version }}.md"
          if [ ! -s "${notes}" ]; then
            echo "::error::${notes} is missing or empty"
            exit 1
          fi
          cp "${notes}" release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  package:
    name: Package
    needs: verify
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      platforms: windows
    secrets: inherit

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [verify, package]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release notes
        run: |
          cp dist/release-notes/release-notes.md notes.md
          cat >> notes.md <<'EOF'

          ## Instalación

          - **Instalador de Windows**: ejecuta `FlipStudio-Setup-*.exe`.
          - **Windows portable**: descomprime `FlipStudio-Portable-*.zip` donde quieras y abre
            `flipstudio.exe` dentro de la carpeta `Flip Studio`. No instala nada; los ajustes se
            guardan en `%APPDATA%\Flip Studio`.

          Windows puede mostrar "Windows protegió su PC" porque el instalador aún no tiene firma
          digital: pulsa **Más información → Ejecutar de todas formas**.

          Flip Studio está basado en [Drift](https://github.com/CutWire-Studios/Drift), de CutWire
          Studios, y se distribuye bajo la licencia GPLv3. El código fuente de esta versión está en
          este repositorio.
          EOF

      # The in-app updater falls back to this when GitHub's API does not give it an asset digest,
      # and refuses to install a file it has no hash for.
      - name: Write SHA256SUMS
        run: |
          sha256sum \
            dist/windows-installer/*.exe \
            dist/windows-portable/*.zip \
            | sed -E 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Flip Studio ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/windows-installer/*.exe \
            dist/windows-portable/*.zip \
            SHA256SUMS
